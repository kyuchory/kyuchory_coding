<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOJ Archive — 백준 온라인 저지 문제 아카이브</title>

    <!-- SEO -->
    <meta
      name="description"
      content="백준 온라인 저지(acmicpc.net) 서비스 종료에 따라 수집한 33,828개 알고리즘 문제 아카이브. 난이도·태그별 검색, 문제 본문 전체 열람 가능."
    />
    <meta
      name="keywords"
      content="백준,BOJ,알고리즘,코딩테스트,문제,아카이브,acmicpc,자료구조,그래프,DP,동적계획법,solved.ac"
    />
    <meta name="author" content="kyuchory" />
    <meta name="robots" content="noindex, nofollow" />
    <link
      rel="canonical"
      href="https://kyuchory.github.io/kyuchory_coding/"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://kyuchory.github.io/kyuchory_coding/"
    />
    <meta
      property="og:title"
      content="BOJ Archive — 백준 온라인 저지 문제 아카이브"
    />
    <meta
      property="og:description"
      content="백준 온라인 저지 33,828개 문제 전체 아카이브. 난이도·태그별 검색, 문제 본문 전체 열람 가능."
    />
    <meta
      property="og:image"
      content="https://kyuchory.github.io/kyuchory_coding/og-image.svg"
    />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="BOJ Archive" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a class="site-logo" href="." aria-label="BOJ Archive">
        <img src="favicon.svg" alt="BOJ Archive" />
      </a>
      <input
        id="search"
        type="text"
        placeholder="문제 번호 또는 제목 검색..."
      />
      <a class="steps-link" href="steps.html">단계별로 풀어보기</a>
      <div class="header-stat" id="stat"></div>
      <a
        class="github-btn"
        href="https://github.com/kyuchory/kyuchory_coding"
        target="_blank"
        rel="noopener"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"
          />
        </svg>
        GitHub
      </a>
    </header>

    <div class="filters">
      <span class="filter-label">난이도</span>
      <button class="tier-btn active" data-tier="all">전체</button>
      <button class="tier-btn" data-tier="0">Unrated</button>
      <button class="tier-btn" data-tier="1-5">Bronze</button>
      <button class="tier-btn" data-tier="6-10">Silver</button>
      <button class="tier-btn" data-tier="11-15">Gold</button>
      <button class="tier-btn" data-tier="16-20">Platinum</button>
      <button class="tier-btn" data-tier="21-25">Diamond</button>
      <button class="tier-btn" data-tier="26-30">Ruby</button>
      <div class="divider"></div>
      <span class="filter-label">태그</span>
      <select id="tag-select">
        <option value="">전체 태그</option>
      </select>
      <div class="divider"></div>
      <span class="filter-label">정렬</span>
      <select id="sort-select">
        <option value="id">번호순</option>
        <option value="level">난이도순</option>
      </select>
      <button class="clear-btn" id="clear-btn">초기화</button>
    </div>

    <main>
      <div id="content">
        <div class="loading">
          <div class="spinner"></div>
          문제 목록 로딩 중...
        </div>
      </div>
      <div class="pagination" id="pagination"></div>
    </main>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal">
        <button class="modal-close" id="modal-close">×</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>

    <footer class="site-footer">
      개인 학습용으로 운영되는 사이트입니다.<br />
      수록된 문제의 저작권은
      <a href="https://www.acmicpc.net" target="_blank" rel="noopener">
        Baekjoon Online Judge (acmicpc.net)
      </a>
      및 각 문제의 원저작자에게 있습니다.
    </footer>
  </body>
</html>
